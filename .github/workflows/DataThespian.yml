name: DataThespian
on:
  push:
    branches-ignore:
      - '*WIP'

# SwiftData is Apple-only, so every job runs on macOS. The FelinePine fork needs
# Swift 6.2 (Xcode 26) or later.
jobs:
  build-macos:
    name: Build on macOS
    env:
      PACKAGE_NAME: DataThespian
    runs-on: ${{ matrix.runs-on }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macos-26]
        # The oldest Swift 6.2 toolchain and the newest stable Xcode on the image.
        xcode: ["26.0", "latest-stable"]
        type: [spm, ios, watchos]
        # The runner image ships simulator runtimes only for its newest Xcode,
        # so the oldest Xcode builds and tests the package with SwiftPM only.
        exclude:
          - xcode: "26.0"
            type: ios
          - xcode: "26.0"
            type: watchos

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # SPM Cache Step
      - name: Cache swift package modules
        if: matrix.type == 'spm'
        uses: actions/cache@v4
        env:
          cache-name: cache-spm
        with:
          path: .build
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.xcode }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.xcode }}-

      - name: Build SPM
        if: matrix.type == 'spm'
        run: swift build

      - name: Run Swift Package tests
        if: matrix.type == 'spm'
        run: swift test -v --enable-code-coverage

      # Simulator device names change with every Xcode, so pick any available
      # device of the platform from the newest installed runtime instead of
      # pinning a name and OS version.
      - name: Find simulator
        if: matrix.type != 'spm'
        run: |
          case "${{ matrix.type }}" in
            ios) runtime="iOS"; prefix="iPhone" ;;
            watchos) runtime="watchOS"; prefix="Apple Watch" ;;
            visionos) runtime="xrOS"; prefix="Apple Vision" ;;
          esac
          udid=$(xcrun simctl list devices available --json | jq -r \
            --arg runtime "SimRuntime.$runtime-" --arg prefix "$prefix" '
              [.devices | to_entries[]
                | select(.key | contains($runtime))
                | .value[] | select(.name | startswith($prefix))]
              | last | .udid // empty')
          if [ -z "$udid" ]; then
            echo "No available $prefix simulator for ${{ matrix.type }}" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Run Device Tests
        if: matrix.type != 'spm'
        run: >
          xcodebuild test
          -scheme ${{ env.PACKAGE_NAME }}
          -destination "id=$SIMULATOR_UDID"
          -enableCodeCoverage YES

      # Common Coverage Steps
      - name: Process Coverage
        uses: sersoft-gmbh/swift-coverage-action@v4
        with:
          fail-on-empty-output: true

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.type }}-xcode${{ matrix.xcode }}
